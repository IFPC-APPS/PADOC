name: CI

# Pourquoi ce fichier existe
# --------------------------
# Le 29/09/2026, un déploiement a rendu la connexion impossible aux
# utilisateurs et il a fallu revenir en arrière à la main sur Railway. Les
# suites de tests existaient déjà — 751 tests au total — mais rien ne les
# exécutait : elles ne tournaient que sur le poste du développeur, quand il y
# pensait.
#
# Ce workflow ne prétend pas empêcher toutes les pannes. Il garantit une seule
# chose, et elle manquait : aucun code n'atteint « main » sans que les trois
# suites soient passées.
#
# Ce qu'il ne fait PAS encore, et qu'il faudra ajouter :
#   - bloquer le déploiement Railway/Vercel sur l'échec de ce workflow
#     (aujourd'hui ils déploient sur push, indépendamment d'ici) ;
#   - couvrir backend/rag_ascocid, qui n'a aucun test.

on:
  push:
    branches: [main]
  pull_request:
  # Permet de relancer à la main depuis l'onglet Actions, sans commit vide.
  workflow_dispatch:

# Une pile de commits poussés coup sur coup n'a pas besoin d'être validée
# entièrement : seul le dernier état compte. Les exécutions précédentes de la
# même branche sont annulées — sauf sur main, dont on veut l'historique complet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Version épinglée plutôt que « ubuntu-latest » : GitHub a annoncé la bascule
# de ce label vers Ubuntu 26 au 19/10/2026. Un changement d'image sous les
# pieds d'une CI se manifeste par des échecs sans rapport avec le code, au
# pire moment. On suivra la migration délibérément.

jobs:
  core-api:
    name: Core API (Spring Boot)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Les tests sont unitaires : ils ne chargent pas le contexte Spring et
      # n'ouvrent aucune connexion. Pas de base à démarrer ici.
      - name: Tests
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test

      # Publié même en cas d'échec : c'est précisément là qu'on en a besoin.
      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-core-api
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  calc-engine:
    name: Calc Engine (FastAPI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Dépendances
        run: pip install -r backend/requirements-dev.txt

      # JWT_SECRET n'est pas fourni ici : backend/tests/conftest.py en fixe un
      # propre aux tests, avant tout import. Une clé dans ce fichier serait une
      # clé publique.
      - name: Tests
        working-directory: backend
        run: pytest tests -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 est en fin de vie depuis avril 2026. Version alignée sur
          # ce que npm résout de façon stable : c'est npm 10 qui a révélé que
          # le lockfile était incomplet, là où npm 11 comblait le trou en
          # silence.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Séparé du lint : une erreur de type passe le lint sans être vue, et
      # c'est le genre de défaut qui casse un build de production.
      - name: Types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Tests
        working-directory: frontend
        run: npm test

  # Point de contrôle unique à exiger dans la protection de branche : il suffit
  assistant:
    name: Assistant AsCoCid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Seulement de quoi exercer les adaptateurs de modèle : ni torch, ni
      # sentence-transformers, qui pèsent plus d'un gigaoctet et que ces tests
      # n'atteignent jamais. Le service complet est construit par son image.
      - name: Dépendances
        run: pip install pytest httpx pydantic

      # Aucun appel réseau : le transport HTTP est simulé. Un test qui
      # joindrait vraiment ARGO échouerait ici faute de clé, et surtout
      # dépendrait de la disponibilité d'un service tiers.
      - name: Tests
        working-directory: backend/rag_ascocid
        run: pytest -q

  # de le déclarer requis une fois, les jobs peuvent ensuite évoluer sans
  # retoucher aux réglages du dépôt.
  verdict:
    name: Verdict
    runs-on: ubuntu-24.04
    needs: [core-api, calc-engine, frontend, assistant]
    if: always()
    steps:
      - name: Échec si une suite a échoué
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Au moins une suite n'est pas passée — ne pas déployer."
          exit 1
      - run: echo "Les quatre suites sont vertes."
