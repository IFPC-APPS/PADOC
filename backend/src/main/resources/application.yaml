spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ifpc}
    username: ${PGUSER:ifpc}
    password: ${PGPASSWORD:ifpc}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
  # Le Core API est servi derrière le front : une adresse publique
  # (ifpc.vercel.app) relaie vers l'hôte interne de l'hébergeur. Sans cette
  # ligne, Spring construit ses redirections avec l'hôte INTERNE, et le
  # navigateur quitte le domaine public au premier renvoi — c'est ainsi que le
  # formulaire de connexion fédérée se retrouvait servi depuis l'URL de
  # l'hébergeur, avec une origine que la liste CORS ne connaissait pas.
  #
  # « framework » fait honorer X-Forwarded-Host et X-Forwarded-Proto, que le
  # relais renseigne : les redirections restent alors sur l'adresse publique.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  # Les 8 Ko par défaut de Tomcat suffisent à une API, pas à un navigateur :
  # sur un poste de développement, tous les services d'un même hôte partagent
  # le domaine « localhost » et leurs cookies s'additionnent. Au-delà de la
  # limite, Tomcat refuse la requête AVANT tout traitement applicatif : la page
  # de connexion recevait un 400 sans corps JSON, donc « Une erreur est
  # survenue » — alors que le mot de passe n'avait même pas été lu.
  max-http-request-header-size: 32KB

# La clé de signature vient exclusivement de l'environnement : aucune valeur
# par défaut ne doit vivre dans le dépôt (cf. JwtService.verifierSecret).
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# Origines autorisées à appeler l'API (CORS), séparées par des virgules.
#
# VIDE PAR DÉFAUT, ET C'EST VOULU : à défaut de valeur, toutes les origines
# sont acceptées. Un défaut restreint avait coupé l'authentification en
# production le 30/09/2026, la variable n'étant pas définie sur le serveur.
# Voir SecurityConfiguration pour le raisonnement complet — en résumé, l'API
# s'authentifie par jeton d'en-tête et non par cookie, donc une origine tierce
# ne peut rien obtenir de plus qu'un appel anonyme.
#
# Restreindre reste souhaitable, mais doit être un choix explicite.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ── Fédération d'identité (spec docs/federation-identite.md) ─────────────────
# Sans FEDERATION_CLIENT_ID, les points d'entrée OIDC répondent mais aucune
# plateforme n'est autorisée : un client par défaut dans le dépôt serait un
# accès public.
federation:
  # URL publique du service. C'est le claim « iss » et la racine du JWKS que
  # les plateformes clientes vérifieront. À définir en production : faute de
  # quoi elle est déduite de chaque requête, donc dictée par l'en-tête Host.
  issuer: ${FEDERATION_ISSUER:}
  client:
    id: ${FEDERATION_CLIENT_ID:}
    # Absent ⇒ client public (application de navigateur, PKCE seul).
    # Présent ⇒ client confidentiel, échange du code de serveur à serveur.
    secret: ${FEDERATION_CLIENT_SECRET:}
    nom: ${FEDERATION_CLIENT_NOM:Plateforme partenaire}
    # Correspondance exacte, séparées par des virgules. Jamais de joker.
    redirect-uris: ${FEDERATION_CLIENT_REDIRECT_URIS:}
    # Rôles de la plateforme accordés d'office aux administrateurs PADOC, dans
    # le vocabulaire de la plateforme, séparés par des virgules. Le défaut vit
    # ici et non dans docker-compose : la production (Railway) ne lit pas ce
    # fichier, et un défaut posé là-bas seulement y laissait la liste vide.
    roles-admin: ${FEDERATION_CLIENT_ROLES_ADMIN:animateur}
    post-logout-uris: ${FEDERATION_CLIENT_POST_LOGOUT_URIS:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:service-informatique@ifpc.eu}
  admin-email: ${RESEND_ADMIN_EMAIL:service-informatique@ifpc.eu}