# PADOC — Orchestration locale complète (4 services)
#
#   docker compose up --build       démarrage
#   docker compose down             arrêt (les données PostgreSQL sont conservées)
#   docker compose down -v          arrêt + suppression du volume de données
#
# Frontend : http://localhost:3000   Core API : http://localhost:8080
# Calc Engine : http://localhost:8000/docs

name: padoc

services:
  db:
    image: postgres:16-alpine
    container_name: padoc-db
    environment:
      POSTGRES_DB: ${PGDATABASE:-ifpc}
      POSTGRES_USER: ${PGUSER:-ifpc}
      POSTGRES_PASSWORD: ${PGPASSWORD:-ifpc}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ifpc} -d ${PGDATABASE:-ifpc}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      # Dockerfile.spring attend le répertoire backend/ comme contexte
      context: ./backend
      dockerfile: Dockerfile.spring
    container_name: padoc-api
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-ifpc}
      PGUSER: ${PGUSER:-ifpc}
      PGPASSWORD: ${PGPASSWORD:-ifpc}
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env (openssl rand -base64 48)}
      # Compte administrateur initial : mot de passe aléatoire si non fourni
      PADOC_ADMIN_EMAIL: ${PADOC_ADMIN_EMAIL:-admin@ifpc.com}
      PADOC_ADMIN_PASSWORD: ${PADOC_ADMIN_PASSWORD:-}
      # Héritier des données antérieures au cloisonnement multi-tenant
      PADOC_LEGACY_OWNER_EMAIL: ${PADOC_LEGACY_OWNER_EMAIL:-admin@ifpc.com}
      # Fédération d'identité (spec docs/federation-identite.md). Sans
      # FEDERATION_CLIENT_ID, les points d'entrée OIDC répondent mais aucune
      # plateforme n'est autorisée.
      # Pas de valeur de repli : « ${VAR:-défaut} » s'applique aussi quand la
      # variable est VIDE, pas seulement absente. Un défaut restreint ici
      # réintroduisait la panne du 30/09 alors même que le code était corrigé —
      # le même mauvais défaut vivait dans trois couches.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FEDERATION_ISSUER: ${FEDERATION_ISSUER:-http://localhost:8080}
      FEDERATION_CLIENT_ID: ${FEDERATION_CLIENT_ID:-}
      FEDERATION_CLIENT_NOM: ${FEDERATION_CLIENT_NOM:-Analyse sensorielle}
      FEDERATION_CLIENT_SECRET: ${FEDERATION_CLIENT_SECRET:-}
      FEDERATION_CLIENT_REDIRECT_URIS: ${FEDERATION_CLIENT_REDIRECT_URIS:-}
      FEDERATION_CLIENT_POST_LOGOUT_URIS: ${FEDERATION_CLIENT_POST_LOGOUT_URIS:-}
      # Un administrateur PADOC administre aussi CiderScope, sans habilitation.
      FEDERATION_CLIENT_ROLES_ADMIN: ${FEDERATION_CLIENT_ROLES_ADMIN:-animateur}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-service-informatique@ifpc.eu}
      RESEND_ADMIN_EMAIL: ${RESEND_ADMIN_EMAIL:-service-informatique@ifpc.eu}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/deploy/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  calc:
    build:
      # Dockerfile.fastapi attend la racine du dépôt comme contexte
      context: .
      dockerfile: backend/Dockerfile.fastapi
    container_name: padoc-calc
    environment:
      # Doit être identique à celui du service api : les jetons sont émis par
      # Spring Boot et vérifiés ici (backend/auth.py).
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env (openssl rand -base64 48)}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  rag:
    build:
      context: ./backend/rag_ascocid
    container_name: padoc-rag
    environment:
      # Fournisseur de modèle. ARGO (INRAE) est le défaut dès que sa clé est
      # présente : un RAG envoie au modèle les PASSAGES du corpus, pas seulement
      # la question, et ce choix décide donc où part le Livre de Connaissances.
      ARGO_API_KEY: ${ARGO_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LDC_FOURNISSEUR: ${LDC_FOURNISSEUR:-}
      # Identique au service api : les jetons sont émis par Spring Boot et
      # vérifiés ici. Sans lui, /ask serait ouvert à tous.
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env (openssl rand -base64 48)}
      # Le corpus est fourni par le volume, déjà ingéré. L'amorçage automatique
      # n'a de sens que sur l'hébergeur sans accès shell : ici il ne ferait que
      # retarder le démarrage pour constater qu'il n'y a rien à faire.
      LDC_AMORCAGE: "0"
      ASCOCID_DATA: /data
      ASCOCID_SQLITE: /data/ascocid.sqlite
    volumes:
      # Monté depuis l'hôte, et non dans un volume nommé : les 341 Mo du corpus
      # arrivent par rsync, et un répertoire visible se remplit, se sauvegarde
      # et s'inspecte sans passer par docker.
      - ${ASCOCID_DONNEES:-./backend/rag_ascocid/data}:/data
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/api/ldc/sante').status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 8
      # Le premier démarrage télécharge 1,1 Go de poids d'embeddings dans le
      # volume, puis les charge en mémoire. Une sonde impatiente redémarrerait
      # le service en boucle sans jamais le laisser finir.
      start_period: 600s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Résolus par le DNS interne de Compose (noms de services), et figés
        # dans le build Next.js : modifier ces valeurs impose un rebuild.
        SPRING_URL: http://api:8080
        FASTAPI_URL: http://calc:8000
        # Sans cette ligne, le build retient « localhost:8100 » — qui, dans le
        # conteneur du front, désigne le conteneur lui-même : l'assistant
        # affiche « service injoignable » sans que rien d'autre ne le signale.
        LDC_URL: http://rag:8100
    container_name: padoc-frontend
    environment:
      # Docker renseigne HOSTNAME avec l'identifiant du conteneur, et le
      # serveur « standalone » de Next s'en sert comme adresse d'écoute : il
      # n'écoutait donc que sur l'IP du conteneur, pas sur localhost. La sonde
      # de santé, qui interroge localhost, le déclarait en panne alors que le
      # service répondait — un faux négatif qui provoque des redémarrages en
      # boucle.
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
      calc:
        condition: service_started
      # Démarré, pas sain : le rag met plusieurs minutes à charger ses poids au
      # premier lancement. Attendre sa santé retarderait tout le front, alors
      # que la page d'assistant sait déjà annoncer un service indisponible.
      rag:
        condition: service_started
    healthcheck:
      # 127.0.0.1 et non « localhost » : /etc/hosts du conteneur fait pointer
      # localhost vers ::1 en premier, or le serveur Next n'écoute qu'en IPv4.
      # La sonde échouait donc alors que le service répondait parfaitement.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
